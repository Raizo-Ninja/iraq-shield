name: Collect live threat data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        run: python scripts/collect.py
      - name: Commit data
        run: |
          git config user.name "iraq-shield-bot"
          git config user.email "bot@iraq-shield.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "data: refresh live feed $(date -u +%FT%TZ)"
          git push
